<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flash cards de ervas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root { --bs-body-bg: #f5f7f9; }
    body { padding-bottom: 105px; }
    .study-card { max-width: 850px; margin-inline: auto; }
    .carousel-image { width: 100%; height: clamp(210px, 47vw, 430px); object-fit: contain; background: #eef1f4; }
    .question { border: 1px solid #dee2e6; border-radius: .85rem; padding: 1rem; margin-block: 1rem; }
    .question-title { font-weight: 600; margin-bottom: .75rem; }
    .question .form-check { padding-block: .3rem; }
    .question.is-correct { border-color: #198754; background: #f0faf4; }
    .question.is-wrong { border-color: #dc3545; background: #fff5f5; }
    .question.is-partial { border-color: #d39e00; background: #fffaf0; }
    .answer-feedback { margin-top: .75rem; font-size: .95rem; }
    .answer-key { border: 1px solid #c8d9c8; border-radius: .85rem; background: #f3f9f3; }
    .answer-key summary { cursor: pointer; font-weight: 600; }
    .answer-key .description-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .score-footer { background: rgba(255,255,255,.97); box-shadow: 0 -3px 18px #00000012; }
    .score-footer .value { font-size: 1.25rem; font-weight: 700; }
    .carousel-indicators [data-bs-target] { background-color: #212529; }
    .carousel-control-prev-icon, .carousel-control-next-icon { filter: invert(1) grayscale(1); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="study-card">
      <header class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <div>
          <h1 class="h3 mb-1">Flashcards de ervas</h1>
          <p class="text-secondary mb-0">Observe as imagens e responda à prova.</p>
        </div>
        <span id="cardCounter" class="badge text-bg-secondary fs-6">—</span>
      </header>

      <div id="status" class="alert alert-info" role="status">Carregando data.json e enum.json…</div>

      <article id="studyCard" class="card shadow-sm border-0 overflow-hidden" hidden>
        <div id="imageCarousel" class="carousel slide" aria-label="Imagens da erva">
          <div id="carouselIndicators" class="carousel-indicators"></div>
          <div id="carouselInner" class="carousel-inner"></div>
          <button id="carouselPrevious" class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev" aria-label="Imagem anterior">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </button>
          <button id="carouselNext" class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next" aria-label="Próxima imagem">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </button>
        </div>

        <div class="card-body p-3 p-md-4">
          <h2 id="cardTitle" class="h4 mb-2">Qual é o nome desta erva?</h2>
          <details id="descriptionDetails" class="answer-key mb-3 p-3">
            <summary>Ver descrição (dica / gabarito oculto)</summary>
            <div id="descriptionText" class="description-body mt-3 text-body-secondary"></div>
          </details>
          <p class="text-secondary">Selecione as respostas que correspondem à erva mostrada acima.</p>

          <form id="quizForm" novalidate>
            <section class="question" id="questionErva">
              <label class="question-title d-block" for="ervaSelect">1. Qual é o nome desta erva?</label>
              <select id="ervaSelect" class="form-select" name="erva" required>
                <option value="">Selecione uma erva...</option>
              </select>
              <div class="answer-feedback" aria-live="polite"></div>
            </section>

            <div id="dynamicQuestions"></div>

            <div id="quizSummary" class="alert" role="status" aria-live="polite" hidden></div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-end mt-4">
              <button id="checkButton" type="submit" class="btn btn-primary btn-lg">Averiguar</button>
              <button id="nextButton" type="button" class="btn btn-outline-primary btn-lg" hidden>Próxima erva</button>
            </div>
          </form>
        </div>
      </article>
    </div>
  </main>

  <footer class="score-footer fixed-bottom border-top" aria-label="Placar da sessão">
    <div class="container py-2 py-sm-3 d-flex flex-wrap gap-3 gap-sm-5 justify-content-center text-center">
      <div><span class="d-block text-success value" id="scoreCorrect">0</span><span class="small text-secondary">Acertos</span></div>
      <div><span class="d-block text-danger value" id="scoreWrong">0</span><span class="small text-secondary">Erros</span></div>
      <div><span class="d-block text-warning-emphasis value" id="scorePartial">0</span><span class="small text-secondary">Parciais</span></div>
      <div><span class="d-block value" id="scoreTotal">0</span><span class="small text-secondary">Questões corrigidas</span></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const state = {
        data: [], enums: null, remaining: [], current: null, corrected: false,
        score: { correct: 0, wrong: 0, partial: 0 }
      };

      const asText = value => String(value ?? '').trim();
      const uniqueStrings = values => [...new Set(values.map(asText).filter(Boolean))];
      const normalize = value => asText(value).normalize('NFC');
      const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

      function showStatus(message, kind = 'danger') {
        const status = $('status');
        status.className = `alert alert-${kind}`;
        status.textContent = message;
        status.hidden = false;
      }

      function addOptions(select, options) {
        select.replaceChildren(new Option('Selecione uma erva...', ''));
        for (const option of options) select.add(new Option(option, option));
      }

      function renderQuestions(card) {
        const container = $('dynamicQuestions');
        container.replaceChildren();
        card.perguntas.forEach((question, questionIndex) => {
          const config = state.enums[question.enum];
          const fieldset = document.createElement('fieldset');
          fieldset.className = 'question';
          fieldset.id = `questionDynamic-${questionIndex}`;
          const legend = document.createElement('legend');
          legend.className = 'question-title fs-6';
          legend.textContent = `${questionIndex + 2}. ${config.enunciado}`;
          const hint = document.createElement('small');
          hint.className = 'text-secondary fw-normal';
          hint.textContent = ' (marque todas as corretas)';
          legend.append(hint);
          fieldset.append(legend);
          config.alternativas.forEach((alternative, optionIndex) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'form-check';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'form-check-input';
            input.id = `answer-${questionIndex}-${optionIndex}`;
            input.value = alternative;
            input.name = `question-${questionIndex}`;
            const label = document.createElement('label');
            label.className = 'form-check-label';
            label.htmlFor = input.id;
            label.textContent = alternative;
            wrapper.append(input, label);
            fieldset.append(wrapper);
          });
          const feedback = document.createElement('div');
          feedback.className = 'answer-feedback';
          feedback.setAttribute('aria-live', 'polite');
          fieldset.append(feedback);
          container.append(fieldset);
        });
      }

      function renderCarousel(images) {
        const inner = $('carouselInner');
        const indicators = $('carouselIndicators');
        inner.replaceChildren();
        indicators.replaceChildren();
        const urls = images.map(asText).filter(Boolean);
        if (!urls.length) {
          const div = document.createElement('div');
          div.className = 'carousel-item active';
          const placeholder = document.createElement('div');
          placeholder.className = 'carousel-image d-flex justify-content-center align-items-center text-secondary';
          placeholder.textContent = 'Imagem não disponível';
          div.append(placeholder);
          inner.append(div);
        }
        urls.forEach((url, i) => {
          const item = document.createElement('div');
          item.className = `carousel-item${i === 0 ? ' active' : ''}`;
          const img = document.createElement('img');
          img.className = 'carousel-image d-block';
          img.src = url;
          img.alt = `Imagem ${i + 1} da erva a identificar`;
          img.loading = i === 0 ? 'eager' : 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.alt = `Não foi possível carregar a imagem ${i + 1}`;
          });
          item.append(img);
          inner.append(item);
          if (urls.length > 1) {
            const indicator = document.createElement('button');
            indicator.type = 'button';
            indicator.dataset.bsTarget = '#imageCarousel';
            indicator.dataset.bsSlideTo = String(i);
            indicator.setAttribute('aria-label', `Mostrar imagem ${i + 1}`);
            if (i === 0) {
              indicator.className = 'active';
              indicator.setAttribute('aria-current', 'true');
            }
            indicators.append(indicator);
          }
        });
        const multiple = urls.length > 1;
        $('carouselPrevious').hidden = !multiple;
        $('carouselNext').hidden = !multiple;
        indicators.hidden = !multiple;
        if (window.bootstrap?.Carousel) {
          const carousel = $('imageCarousel');
          bootstrap.Carousel.getInstance(carousel)?.dispose();
          new bootstrap.Carousel(carousel, { interval: false, ride: false, wrap: true });
        }
      }

      function newCycle() {
        state.remaining = state.data.map((_, index) => index);
      }

      function nextCard() {
        if (!state.remaining.length) newCycle();
        const randomPosition = Math.floor(Math.random() * state.remaining.length);
        const [index] = state.remaining.splice(randomPosition, 1);
        state.current = state.data[index];
        state.corrected = false;
        const form = $('quizForm');
        form.reset();
        form.querySelectorAll('input, select').forEach(input => input.disabled = false);
        for (const question of form.querySelectorAll('.question')) {
          question.classList.remove('is-correct', 'is-wrong', 'is-partial');
          question.querySelector('.answer-feedback').replaceChildren();
        }
        $('quizSummary').hidden = true;
        $('checkButton').hidden = false;
        $('nextButton').hidden = true;
        $('cardTitle').textContent = 'Qual é o nome desta erva?';
        $('descriptionDetails').open = false;
        $('descriptionText').textContent = asText(state.current.descricao) || 'Nenhuma descrição cadastrada.';
        $('cardCounter').textContent = `${state.data.length - state.remaining.length} / ${state.data.length}`;
        renderCarousel(state.current.hrefImages || []);
        renderQuestions(state.current);
        $('studyCard').hidden = false;
        $('status').hidden = true;
      }

      function getChecked(name) {
        return new Set([...document.querySelectorAll(`input[name="${name}"]:checked`)].map(e => normalize(e.value)));
      }

      function evaluateMulti(selected, expected) {
        const wanted = new Set(expected.map(normalize));
        if (sameSet(selected, wanted)) return 'correct';
        // Seleção parcialmente correta quando existe pelo menos uma opção correta marcada,
        // mesmo que haja também opções incorretas. Sem coincidências = erro.
        return [...selected].some(option => wanted.has(option)) ? 'partial' : 'wrong';
      }

      function evaluateQuestion(id, result, expectedText) {
        const section = $(id);
        const names = { correct: 'Correto', wrong: 'Incorreto', partial: 'Parcialmente correto' };
        section.classList.add(`is-${result}`);
        const feedback = section.querySelector('.answer-feedback');
        const headline = document.createElement('strong');
        headline.textContent = `${result === 'correct' ? '✓' : result === 'partial' ? '◐' : '✗'} ${names[result]}`;
        const detail = document.createElement('div');
        detail.textContent = `Resposta esperada: ${expectedText}`;
        feedback.append(headline, detail);
        state.score[result]++;
        return result;
      }

      function refreshScore() {
        $('scoreCorrect').textContent = state.score.correct;
        $('scoreWrong').textContent = state.score.wrong;
        $('scorePartial').textContent = state.score.partial;
        $('scoreTotal').textContent = state.score.correct + state.score.wrong + state.score.partial;
      }

      function checkAnswers(event) {
        event.preventDefault();
        if (state.corrected || !state.current) return;
        state.corrected = true;
        const card = state.current;
        const results = [];
        const chosenHerb = normalize($('ervaSelect').value);
        const herb = normalize(card.erva);
        results.push(evaluateQuestion('questionErva', chosenHerb && chosenHerb === herb ? 'correct' : 'wrong', herb));

        card.perguntas.forEach((question, index) => {
          const expected = question.resposta.map(normalize);
          const selected = getChecked(`question-${index}`);
          const result = evaluateMulti(selected, expected);
          results.push(evaluateQuestion(`questionDynamic-${index}`, result, expected.join(', ') || 'Nenhuma'));
        });

        $('quizForm').querySelectorAll('input, select').forEach(input => input.disabled = true);
        const correct = results.filter(r => r === 'correct').length;
        const partial = results.filter(r => r === 'partial').length;
        const wrong = results.length - correct - partial;
        const summary = $('quizSummary');
        summary.className = `alert ${correct === results.length ? 'alert-success' : 'alert-info'}`;
        summary.textContent = `Resultado desta erva (${results.length} questões): ${correct} acerto(s), ${wrong} erro(s), ${partial} acerto(s) parcial(is).`;
        summary.hidden = false;
        $('checkButton').hidden = true;
        $('nextButton').hidden = false;
        refreshScore();
      }

      async function initialize() {
        try {
          const [dataResponse, enumResponse] = await Promise.all([
            fetch('./data.json', { cache: 'no-store' }),
            fetch('./enum.json', { cache: 'no-store' })
          ]);
          if (!dataResponse.ok || !enumResponse.ok) {
            throw new Error(`HTTP data.json: ${dataResponse.status}; enum.json: ${enumResponse.status}`);
          }
          const [data, enums] = await Promise.all([dataResponse.json(), enumResponse.json()]);
          if (!Array.isArray(data) || data.length === 0) throw new Error('data.json precisa ser uma lista não vazia.');
          if (!enums || typeof enums !== 'object' || Array.isArray(enums)) {
            throw new Error('enum.json precisa ser um objeto com as categorias de perguntas.');
          }
          for (const [key, definition] of Object.entries(enums)) {
            if (!definition || typeof definition.enunciado !== 'string' || !definition.enunciado.trim() ||
                !Array.isArray(definition.alternativas) || !definition.alternativas.length ||
                !definition.alternativas.every(item => typeof item === 'string' && item.trim()) ||
                new Set(definition.alternativas.map(normalize)).size !== definition.alternativas.length) {
              throw new Error(`Categoria "${key}" inválida em enum.json.`);
            }
          }
          for (const [index, card] of data.entries()) {
            if (!card || typeof card.erva !== 'string' || !card.erva.trim() ||
                !Array.isArray(card.hrefImages) ||
                !Array.isArray(card.perguntas) ||
                (card.descricao !== undefined && typeof card.descricao !== 'string')) {
              throw new Error(`Estrutura inválida no item ${index + 1} de data.json.`);
            }
            const keys = new Set();
            for (const [qIndex, question] of card.perguntas.entries()) {
              if (!question || typeof question.enum !== 'string' || !Object.hasOwn(enums, question.enum)) {
                throw new Error(`Categoria inexistente na pergunta ${qIndex + 1} da erva ${card.erva}.`);
              }
              if (keys.has(question.enum)) {
                throw new Error(`Categoria repetida "${question.enum}" na erva ${card.erva}.`);
              }
              keys.add(question.enum);
              const options = new Set(enums[question.enum].alternativas.map(normalize));
              if (!Array.isArray(question.resposta) ||
                  !question.resposta.every(answer => typeof answer === 'string' && options.has(normalize(answer))) ||
                  new Set(question.resposta.map(normalize)).size !== question.resposta.length) {
                throw new Error(`Respostas inválidas na pergunta ${qIndex + 1} da erva ${card.erva}.`);
              }
            }
          }
          state.data = data;
          state.enums = enums;
          const nomesErvas = [];
          data.forEach(card => nomesErvas.push(card.erva));
          addOptions($('ervaSelect'), uniqueStrings(nomesErvas).sort((a, b) => a.localeCompare(b, 'pt-BR')));
          $('quizForm').addEventListener('submit', checkAnswers);
          $('nextButton').addEventListener('click', nextCard);
          refreshScore();
          nextCard();
        } catch (error) {
          showStatus(`Não foi possível carregar a prova: ${error.message}. Coloque index.html, data.json e enum.json na mesma pasta e abra a página por HTTP/HTTPS (GitHub Pages ou localhost).`);
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
